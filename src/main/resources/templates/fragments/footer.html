<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="footer">
      <footer class="footer-nuevo">
        <div class="footer-contenedor">
          <div class="footer-logo-box">
            <img
              alt="Logo Pelucas Caninas"
              th:src="@{/img/Pelucas Caninas.png}"
            />
          </div>
          <div class="footer-col">
            <h4>Navegación</h4>
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/servicios}">Servicios</a>
            <a th:href="@{/productos}">Productos</a>
            <a th:href="@{/contacto}">Contáctanos</a>
            <a th:href="@{/nosotros}">Nosotros</a>
          </div>
          <div class="footer-col">
            <h4>Síguenos</h4>
            <div class="footer-redes-nuevo">
              <a
                aria-label="TikTok"
                href="https://www.tiktok.com/@pelucascaninasok?lang=es-419"
                rel="noopener noreferrer"
                target="_blank"
              >
                <i class="fab fa-tiktok"></i>
              </a>
              <a
                aria-label="Facebook"
                href="https://www.facebook.com/profile.php?id=100064917535819"
                rel="noopener noreferrer"
                target="_blank"
              >
                <i class="fab fa-facebook-f"></i>
              </a>
              <a
                aria-label="Instagram"
                href="https://www.instagram.com/pelucascaninas/"
                rel="noopener noreferrer"
                target="_blank"
              >
                <i class="fab fa-instagram"></i>
              </a>
            </div>
            <h4 class="contactame-titulo">Contáctame</h4>
            <p class="footer-correo">
              <i class="fa-solid fa-envelope"></i>
              manueltirado1978@gmail.com
            </p>
          </div>
          <div class="footer-imagenes">
            <a th:href="@{/libro-reclamaciones}">
              <img
                alt="Libro de Reclamaciones"
                decoding="async"
                loading="lazy"
                th:src="@{/img/Libro de reclamaciones.jpg}"
              />
            </a>
            <img
              alt="Medios de pago"
              decoding="async"
              loading="lazy"
              th:src="@{/img/pagos.png}"
            />
          </div>
          <div class="footer-col footer-legal">
            <h4>Información legal</h4>
            <a th:href="@{/politica-privacidad}">Política de Privacidad</a
            ><a th:href="@{/terminos}">Términos y Condiciones</a>
          </div>
        </div>
        <p class="footer-copy-nuevo">
          © 2026 Pelucas Caninas - Todos los derechos reservados
        </p>
      </footer>
      <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
      ></script>
      <script th:src="@{/js/app.js}"></script>
    </th:block>
  </body>
</html>
