<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(titulo, cssPagina)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script th:src="@{/js/theme.js}"></script>
    <meta
      name="description"
      content="Pelucas Caninas: peluquería, cuidados y productos para tu mascota."
    />
    <title th:text="${titulo}">Pelucas Caninas</title>
    <link rel="icon" th:href="@{/img/perritos.png}" type="image/png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=DM+Serif+Display:ital@0;1&amp;display=swap"
    />
    <link rel="stylesheet" th:href="@{/css/style-general.css}" />
    <link rel="stylesheet" th:href="@{/css/style-figma.css}" />
    <link
      rel="stylesheet"
      th:if="${cssPagina != null}"
      th:href="@{${cssPagina}(v='20261022-legal-2')}"
    />
    <link
      rel="stylesheet"
      th:href="@{/css/style-adaptaciones.css(v='20261022-legal-2')}"
    />
  </head>
</html>
