<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Administración - Mascotas', '/css/style-admin.css')}">
  </head>
  <body class="page admin-shell">
    <div th:replace="~{admin/fragments :: cabecera}">
    </div>
    <main class="admin-page" id="contenido-admin">
      <div th:replace="~{admin/fragments :: navegacion}">
      </div>
      <header class="admin-heading">
        <div>
          <p class="admin-eyebrow">Gestión del negocio</p>
          <h1>Mascotas</h1>
          <p>Consulta, registra y actualiza la información de mascotas.</p>
        </div>
        <a class="admin-button" th:href="@{/admin/mascotas/nuevo}">+ Nueva mascota</a>
      </header>
      <div th:replace="~{admin/fragments :: mensajes}">
      </div>
      <div class="admin-table-wrap" role="region" tabindex="0" aria-label="Lista de mascotas">
        <table class="admin-table">
          <caption class="visually-hidden">Lista de mascotas</caption>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Nombre</th>
              <th scope="col">Responsable</th>
              <th scope="col">Especie</th>
              <th scope="col">Raza</th>
              <th scope="col">Nacimiento</th>
              <th scope="col">Observaciones</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(registros)}">
              <td class="admin-empty" colspan="8">Todavía no hay registros. Usa el botón de nuevo registro para comenzar.</td>
            </tr>
            <tr th:each="registro : ${registros}">
              <td th:text="${registro.id}">
              </td>
              <td th:text="${registro.nombre}">
              </td>
              <td th:text="${registro.cliente.nombres + ' ' + (registro.cliente.apellidos ?: '')}">
              </td>
              <td th:text="${registro.especie}">
              </td>
              <td th:text="${registro.raza}">
              </td>
              <td th:text="${registro.fechaNacimiento}">
              </td>
              <td th:text="${registro.observaciones}">
              </td>
              <td>
                <div class="admin-actions">
                  <a class="admin-action-link" th:href="@{/admin/mascotas/{id}/editar(id=${registro.id})}" th:attr="aria-label=|Editar registro ${registro.id}|">Editar</a>
                  <form method="post" th:action="@{/admin/mascotas/{id}/eliminar(id=${registro.id})}" data-confirm="¿Eliminar este registro? Los registros asociados pueden impedir la eliminación.">
                    <button class="admin-action-link admin-action-delete" type="submit" th:attr="aria-label=|Eliminar registro ${registro.id}|">Eliminar</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <div th:replace="~{admin/fragments :: pie}">
    </div>
  </body>
</html>
