<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head(${tituloFormulario}, '/css/style-admin.css')}">
  </head>
  <body class="page admin-shell">
    <div th:replace="~{admin/fragments :: cabecera}">
    </div>
    <main class="admin-page" id="contenido-admin">
      <div th:replace="~{admin/fragments :: navegacion}">
      </div>
      <header class="admin-heading">
        <div>
          <p class="admin-eyebrow">Mascotas</p>
          <h1 th:text="${tituloFormulario}">
          </h1>
          <p>Los campos con * son obligatorios.</p>
        </div>
      </header>
      <form class="admin-form" th:action="@{${accion}}" th:object="${formulario}" method="post">
        <div class="admin-message admin-error" role="alert" th:if="${#fields.hasAnyErrors()}">
          Revisa los campos indicados antes de guardar.
          <ul>
            <li th:each="error : ${#fields.allErrors()}" th:text="${error}">
            </li>
          </ul>
        </div>
        <div class="admin-field">
          <label for="idCliente">Cliente responsable *</label>
          <select th:field="*{idCliente}" th:errorclass="admin-invalid" aria-describedby="idCliente-error" required>
            <option value="">Selecciona un registro</option>
            <option th:each="opcion : ${clientes}" th:value="${opcion.id}" th:text="${opcion.nombres + ' ' + (opcion.apellidos ?: '')}">
            </option>
          </select>
          <span id="idCliente-error" class="admin-field-error" th:errors="*{idCliente}">
          </span>
        </div>
        <div class="admin-field">
          <label for="nombre">Nombre *</label>
          <input type="text" th:field="*{nombre}" th:errorclass="admin-invalid" aria-describedby="nombre-error" maxlength="80" required>
          <span id="nombre-error" class="admin-field-error" th:errors="*{nombre}">
          </span>
        </div>
        <div class="admin-field">
          <label for="especie">Especie *</label>
          <input type="text" th:field="*{especie}" th:errorclass="admin-invalid" aria-describedby="especie-error" maxlength="30" required>
          <span id="especie-error" class="admin-field-error" th:errors="*{especie}">
          </span>
        </div>
        <div class="admin-field">
          <label for="raza">Raza</label>
          <input type="text" th:field="*{raza}" th:errorclass="admin-invalid" aria-describedby="raza-error" maxlength="80">
          <span id="raza-error" class="admin-field-error" th:errors="*{raza}">
          </span>
        </div>
        <div class="admin-field">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" th:field="*{fechaNacimiento}" th:errorclass="admin-invalid" aria-describedby="fechaNacimiento-error">
          <span id="fechaNacimiento-error" class="admin-field-error" th:errors="*{fechaNacimiento}">
          </span>
        </div>
        <div class="admin-field">
          <label for="observaciones">Observaciones</label>
          <textarea th:field="*{observaciones}" th:errorclass="admin-invalid" aria-describedby="observaciones-error" rows="4" maxlength="500">
          </textarea>
          <span id="observaciones-error" class="admin-field-error" th:errors="*{observaciones}">
          </span>
        </div>
        <div class="admin-actions">
          <button class="admin-button" type="submit">Guardar mascota</button>
          <a class="admin-button admin-secondary" th:href="@{/admin/mascotas}">Cancelar</a>
        </div>
      </form>
    </main>
    <div th:replace="~{admin/fragments :: pie}">
    </div>
  </body>
</html>
