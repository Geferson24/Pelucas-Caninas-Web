<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Administración - Citas', '/css/style-admin.css')}">
  </head>
  <body class="page admin-shell">
    <div th:replace="~{admin/fragments :: cabecera}">
    </div>
    <main class="admin-page" id="contenido-admin">
      <div th:replace="~{admin/fragments :: navegacion}">
      </div>
      <header class="admin-heading">
        <div>
          <p class="admin-eyebrow">Gestión del negocio</p>
          <h1>Citas</h1>
          <p>Consulta, registra y actualiza la información de citas.</p>
        </div>
        <a class="admin-button" th:href="@{/admin/citas/nuevo}">+ Nueva cita</a>
      </header>
      <div th:replace="~{admin/fragments :: mensajes}">
      </div>
      <div class="admin-table-wrap" role="region" tabindex="0" aria-label="Lista de citas">
        <table class="admin-table">
          <caption class="visually-hidden">Lista de citas</caption>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Mascota</th>
              <th scope="col">Responsable</th>
              <th scope="col">Servicio</th>
              <th scope="col">Fecha</th>
              <th scope="col">Estado</th>
              <th scope="col">Precio</th>
              <th scope="col">Observaciones</th>
              <th scope="col">Registro</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(registros)}">
              <td class="admin-empty" colspan="10">Todavía no hay registros. Usa el botón de nuevo registro para comenzar.</td>
            </tr>
            <tr th:each="registro : ${registros}">
              <td th:text="${registro.id}">
              </td>
              <td th:text="${registro.mascota.nombre}">
              </td>
              <td th:text="${registro.mascota.cliente.nombres}">
              </td>
              <td th:text="${registro.servicio.nombre}">
              </td>
              <td th:text="${#temporals.format(registro.fecha, 'dd/MM/yyyy HH:mm:ss')}">
              </td>
              <td th:text="${registro.estado}">
              </td>
              <td th:text="${registro.precioAcordado != null ? 'S/ ' + registro.precioAcordado : 'Por definir'}">
              </td>
              <td th:text="${registro.observaciones}">
              </td>
              <td th:text="${#temporals.format(registro.fechaRegistro, 'dd/MM/yyyy HH:mm:ss')}">
              </td>
              <td>
                <div class="admin-actions">
                  <a class="admin-action-link" th:href="@{/admin/citas/{id}/editar(id=${registro.id})}" th:attr="aria-label=|Editar registro ${registro.id}|">Editar</a>
                  <form method="post" th:action="@{/admin/citas/{id}/eliminar(id=${registro.id})}" data-confirm="¿Eliminar este registro? Los registros asociados pueden impedir la eliminación.">
                    <button class="admin-action-link admin-action-delete" type="submit" th:attr="aria-label=|Eliminar registro ${registro.id}|">Eliminar</button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <div th:replace="~{admin/fragments :: pie}">
    </div>
  </body>
</html>
