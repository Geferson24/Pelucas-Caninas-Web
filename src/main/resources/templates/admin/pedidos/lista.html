<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Administración - Pedidos', '/css/style-admin.css')}">
  </head>
  <body class="page admin-shell">
    <div th:replace="~{admin/fragments :: cabecera}">
    </div>
    <main class="admin-page" id="contenido-admin">
      <div th:replace="~{admin/fragments :: navegacion}">
      </div>
      <header class="admin-heading">
        <div>
          <p class="admin-eyebrow">Gestión del negocio</p>
          <h1>Pedidos</h1>
          <p>Consulta, registra y actualiza la información de pedidos.</p>
        </div>
        <a class="admin-button" th:href="@{/admin/pedidos/nuevo}">+ Nuevo pedido</a>
      </header>
      <div th:replace="~{admin/fragments :: mensajes}">
      </div>
      <div class="admin-table-wrap" role="region" tabindex="0" aria-label="Lista de pedidos">
        <table class="admin-table">
          <caption class="visually-hidden">Lista de pedidos</caption>
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Cliente</th>
              <th scope="col">Fecha</th>
              <th scope="col">Estado</th>
              <th scope="col">Canal</th>
              <th scope="col">Total</th>
              <th scope="col">Observaciones</th>
              <th scope="col">Acciones</th>
              <th scope="col">Detalle del pedido</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(registros)}">
              <td class="admin-empty" colspan="9">Todavía no hay registros. Usa el botón de nuevo registro para comenzar.</td>
            </tr>
            <tr th:each="registro : ${registros}">
              <td th:text="${registro.id}">
              </td>
              <td th:text="${registro.cliente.nombres + ' ' + (registro.cliente.apellidos ?: '')}">
              </td>
              <td th:text="${#temporals.format(registro.fecha, 'dd/MM/yyyy HH:mm:ss')}">
              </td>
              <td th:text="${registro.estado}">
              </td>
              <td th:text="${registro.canal}">
              </td>
              <td th:text="${'S/ ' + registro.total}">
              </td>
              <td th:text="${registro.observaciones}">
              </td>
              <td>
                <div class="admin-actions">
                  <a class="admin-action-link" th:href="@{/admin/pedidos/{id}/editar(id=${registro.id})}" th:attr="aria-label=|Editar registro ${registro.id}|">Editar</a>
                  <form method="post" th:action="@{/admin/pedidos/{id}/eliminar(id=${registro.id})}" data-confirm="¿Eliminar este registro? Los registros asociados pueden impedir la eliminación.">
                    <button class="admin-action-link admin-action-delete" type="submit" th:attr="aria-label=|Eliminar registro ${registro.id}|">Eliminar</button>
                  </form>
                </div>
              </td>
              <td>
                <a class="admin-text-link" th:href="@{/admin/detalles-pedido(pedido=${registro.id})}">Ver detalles ↗</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <div th:replace="~{admin/fragments :: pie}">
    </div>
  </body>
</html>
