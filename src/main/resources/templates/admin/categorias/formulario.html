<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head(${tituloFormulario}, '/css/style-admin.css')}"
  ></head>
  <body class="page admin-shell">
    <div th:replace="~{admin/fragments :: cabecera}"></div>
    <main class="admin-page" id="contenido-admin">
      <div th:replace="~{admin/fragments :: navegacion}"></div>
      <header class="admin-heading">
        <div>
          <p class="admin-eyebrow">Categorías</p>
          <h1 th:text="${tituloFormulario}"></h1>
          <p>Los campos con * son obligatorios.</p>
        </div>
      </header>
      <form
        class="admin-form"
        th:action="@{${accion}}"
        th:object="${categoria}"
        method="post"
      >
        <div
          class="admin-message admin-error"
          role="alert"
          th:if="${#fields.hasAnyErrors()}"
        >
          Revisa los campos indicados antes de guardar.
          <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>
        <div class="admin-field">
          <label for="nombre">Nombre *</label><input
            th:field="*{nombre}"
            required
            maxlength="80"
            th:errorclass="admin-invalid"
            aria-describedby="nombre-error"
          /><span
            id="nombre-error"
            class="admin-field-error"
            th:errors="*{nombre}"
          ></span>
        </div>
        <div class="admin-field">
          <label for="codigo">Código *</label><input
            th:field="*{codigo}"
            required
            maxlength="40"
            pattern="[a-z0-9]+(-[a-z0-9]+)*"
            th:errorclass="admin-invalid"
            aria-describedby="codigo-ayuda codigo-error"
          /><small id="codigo-ayuda"
            >Minúsculas, números y guiones. Ejemplo: cuidado-dental. El código
            «all» está reservado.</small><span
            id="codigo-error"
            class="admin-field-error"
            th:errors="*{codigo}"
          ></span>
        </div>
        <div class="admin-field">
          <label for="descripcion">Descripción</label><textarea
            th:field="*{descripcion}"
            rows="4"
            maxlength="255"
            th:errorclass="admin-invalid"
            aria-describedby="descripcion-error"
          ></textarea><span
            id="descripcion-error"
            class="admin-field-error"
            th:errors="*{descripcion}"
          ></span>
        </div>
        <div class="admin-actions">
          <button class="admin-button" type="submit">Guardar categoría</button><a
            class="admin-button admin-secondary"
            th:href="@{/admin/categorias}"
            >Cancelar</a>
        </div>
      </form>
    </main>
    <div th:replace="~{admin/fragments :: pie}"></div>
  </body>
</html>
