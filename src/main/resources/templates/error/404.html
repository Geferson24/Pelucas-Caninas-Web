<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('404 - Pelucas Caninas', '/css/style-error.css')}"
  ></head>
  <body class="page">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="error-page" aria-labelledby="error-title">
      <div class="error-page__visual" aria-hidden="true">
        <span class="error-code">404</span>
        <img th:src="@{/img/perritos.png}" alt="" width="220" height="220" />
      </div>
      <div class="error-page__copy">
        <p class="error-page__eyebrow">Un pequeño desvío</p>
        <h1 id="error-title">Esta página se nos escapó</h1>
        <p class="error-page__description">
          La dirección no existe o el producto ya no está en el catálogo.
        </p>
        <div class="error-page__actions">
          <a class="button" th:href="@{/}">Volver al inicio</a>
          <a class="button button--outline" th:href="@{/productos}"
            >Ver productos</a>
        </div>
      </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
