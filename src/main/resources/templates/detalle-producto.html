<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head(${producto.nombre}, '/css/style-productos-seleccionados.css')}"
  >
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main
      class="producto-grande"
      th:attr="data-nombre=${producto.nombre},data-precio=${producto.precio},data-img=@{${producto.imagen}}"
    >
      <div class="producto-img">
        <img
          decoding="async"
          loading="lazy"
          th:alt="${producto.nombre}"
          th:src="@{${producto.imagen}}"
        />
      </div>
      <div class="producto-info">
        <p class="categoria" th:text="${producto.categoria}">Categoría</p>
        <h1 th:text="${producto.nombre}">Nombre del producto</h1>
        <h2 th:text="|S/ ${producto.precio}|">S/ 0.00</h2>
        <p class="descripcion" th:text="${producto.descripcion}">
          Descripción del producto...
        </p>
        <button class="btn-add-cart" type="button">
          <i class="fa-solid fa-cart-plus"> </i>
          Agregar al carrito
        </button>
        <a class="volver-catalogo" th:href="@{/productos}">
          Volver al catálogo
        </a>
      </div>
    </main>
    <section class="productos-relacionados">
      <h2>Más de nuestros productos</h2>
      <div class="contenedor-productos">
        <!-- Bucle para mostrar los productos abajo de manera dinámica -->
        <a
          class="card-producto"
          th:each="p : ${relacionados}"
          th:href="@{/productos/{id}(id=${p.id})}"
        >
          <img
            decoding="async"
            loading="lazy"
            th:alt="${p.nombre}"
            th:src="@{${p.imagen}}"
          />
          <h3 th:text="${p.nombre}"></h3>
          <p th:text="|S/ ${p.precio}|">S/ 0.00</p>
        </a>
      </div>
    </section>
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
