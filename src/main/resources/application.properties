spring.application.name=pelucas-caninas
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pelucas_caninas?allowPublicKeyRetrieval=true&connectionTimeZone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.thymeleaf.encoding=UTF-8

spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.no-store=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

spring.web.error.whitelabel.enabled=false
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
